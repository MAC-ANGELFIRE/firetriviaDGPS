,"difficulty":"medio","text":"¿Cuánto tiempo antes de dormir se recomienda dejar de usar pantallas?","optionA":"1 minuto","optionB":"Al menos 30 a 60 minutos","optionC":"No es necesario","correct":"B","explanation":"Reducir la exposición a luz azul mejora el inicio del sueño."},{"category":"Descanso y sueño","difficulty":"medio","text":"¿Cuál es la duración ideal de una siesta reparadora?","optionA":"3 horas","optionB":"20 a 30 minutos","optionC":"5 minutos","correct":"B","explanation":"Las siestas largas pueden causar aturdimiento y afectar el sueño nocturno."},{"category":"Descanso y sueño","difficulty":"medio","text":"La falta crónica de sueño aumenta el riesgo de…","optionA":"Mejor memoria","optionB":"Obesidad, diabetes e hipertensión","optionC":"Mayor fuerza","correct":"B","explanation":"El sueño insuficiente altera hormonas del apetito y el metabolismo."},{"category":"Descanso y sueño","difficulty":"medio","text":"¿Qué es el insomnio?","optionA":"Dificultad para conciliar o mantener el sueño","optionB":"Dormir demasiado","optionC":"Roncar fuerte","correct":"A","explanation":"El insomnio persistente debe consultarse con un profesional."},{"category":"Descanso y sueño","difficulty":"medio","text":"¿Cuántas horas de sueño necesita un bebé de 4 a 12 meses?","optionA":"12 a 16 horas (incluyendo siestas)","optionB":"6 horas","optionC":"24 horas","correct":"A","explanation":"El sueño es clave para el desarrollo cerebral del bebé."},{"category":"Descanso y sueño","difficulty":"medio","text":"¿Qué posición es segura para dormir a un bebé y prevenir la muerte súbita?","optionA":"Boca abajo","optionB":"Boca arriba","optionC":"Sentado","correct":"B","explanation":"Dormir boca arriba reduce el riesgo de muerte súbita del lactante."},{"category":"Descanso y sueño","difficulty":"avanzado","text":"¿Qué trastorno se caracteriza por pausas respiratorias durante el sueño?","optionA":"Apnea obstructiva del sueño","optionB":"Narcolepsia","optionC":"Sonambulismo","correct":"A","explanation":"Se asocia a ronquidos fuertes, obesidad y somnolencia diurna."},{"category":"Descanso y sueño","difficulty":"avanzado","text":"¿En qué fase del sueño ocurren la mayoría de los sueños vívidos?","optionA":"Fase 1","optionB":"Fase REM","optionC":"Vigilia","correct":"B","explanation":"REM: movimientos oculares rápidos."},{"category":"Descanso y sueño","difficulty":"avanzado","text":"¿Cuánto dura aproximadamente un ciclo completo de sueño?","optionA":"90 minutos","optionB":"10 minutos","optionC":"5 horas","correct":"A","explanation":"Durante la noche se repiten 4 a 6 ciclos."},{"category":"Descanso y sueño","difficulty":"avanzado","text":"¿Qué se denomina 'ritmo circadiano'?","optionA":"Ritmo del corazón","optionB":"Frecuencia respiratoria","optionC":"Ciclo biológico de aproximadamente 24 horas","correct":"C","explanation":"Es regulado por la luz y el núcleo supraquiasmático."},{"category":"Descanso y sueño","difficulty":"avanzado","text":"¿Qué hormona del apetito aumenta cuando dormimos poco?","optionA":"Leptina","optionB":"Grelina","optionC":"Tiroxina","correct":"B","explanation":"La grelina aumenta el hambre; la leptina (saciedad) disminuye."},{"category":"Descanso y sueño","difficulty":"avanzado","text":"¿Cuántas horas antes de dormir se recomienda evitar la cafeína?","optionA":"10 minutos","optionB":"No afecta","optionC":"Al menos 6 horas","correct":"C","explanation":"La cafeína tiene una vida media de 5-6 horas."},{"category":"Hidratación","difficulty":"principiante","text":"¿Qué porcentaje aproximado del cuerpo humano es agua?","optionA":"10%","optionB":"Alrededor del 60%","optionC":"95%","correct":"B","explanation":"El agua es esencial para todas las funciones vitales."},{"category":"Hidratación","difficulty":"principiante","text":"¿Cuál es una señal de deshidratación?","optionA":"Orina clara","optionB":"Mucha energía","optionC":"Sed, boca seca y orina oscura","correct":"C","explanation":"La orina clara indica buena hidratación."},{"category":"Hidratación","difficulty":"principiante","text":"En días de mucho calor, ¿qué debemos hacer?","optionA":"Hacer ejercicio al sol","optionB":"Beber más agua y evitar el sol del mediodía","optionC":"Tomar alcohol","correct":"B","explanation":"El golpe de calor puede ser grave."},{"category":"Hidratación","difficulty":"principiante","text":"¿Qué grupo es más vulnerable a la deshidratación?","optionA":"Niños pequeños y adultos mayores","optionB":"Adultos jóvenes","optionC":"Nadie","correct":"A","explanation":"Ambos grupos regulan peor la temperatura y la sed."},{"category":"Hidratación","difficulty":"medio","text":"¿Qué se debe dar a un niño con diarrea para prevenir la deshidratación?","optionA":"Gaseosa","optionB":"Nada de líquidos","optionC":"Sales de rehidratación oral (suero)","correct":"C","explanation":"El suero oral salva vidas."},{"category":"Hidratación","difficulty":"medio","text":"¿Cuántas cucharaditas de azúcar tiene aproximadamente una lata de gaseosa de 350 ml?","optionA":"1","optionB":"Alrededor de 9 a 10","optionC":"2","correct":"B","explanation":"Supera el límite diario recomendado de azúcar."},{"category":"Hidratación","difficulty":"medio","text":"¿Qué bebida produce más deshidratación?","optionA":"Agua","optionB":"Alcohol","optionC":"Agua con limón","correct":"B","explanation":"El alcohol es diurético."},{"category":"Hidratación","difficulty":"avanzado","text":"¿Qué electrolito se pierde principalmente con el sudor?","optionA":"Hierro","optionB":"Calcio","optionC":"Sodio","correct":"C","explanation":"Por eso el sudor tiene sabor salado."},{"category":"Hidratación","difficulty":"avanzado","text":"¿Qué es la hiponatremia por ejercicio?","optionA":"Falta de agua","optionB":"Bajo sodio en sangre por beber agua en exceso","optionC":"Exceso de potasio","correct":"B","explanation":"Puede ocurrir en maratonistas que beben demasiada agua."},{"category":"Salud mental","difficulty":"principiante","text":"¿Qué es la salud mental según la OMS?","optionA":"Un estado de bienestar que permite afrontar el estrés y contribuir a la comunidad","optionB":"Solo la ausencia de enfermedad mental","optionC":"Estar siempre feliz","correct":"A","explanation":"La salud mental es parte integral de la salud."},{"category":"Salud mental","difficulty":"principiante","text":"¿Qué podemos hacer cuando nos sentimos muy estresados?","optionA":"Guardarlo todo y no hablar","optionB":"Respirar profundo y hablar con alguien de confianza","optionC":"Tomar alcohol","correct":"B","explanation":"Compartir lo que sentimos es un acto de valentía."},{"category":"Salud mental","difficulty":"principiante","text":"¿Qué actividad ayuda a reducir el estrés?","optionA":"Pasar 8 horas en redes sociales","optionB":"Dormir menos","optionC":"Caminar al aire libre","correct":"C","explanation":"El contacto con la naturaleza reduce el cortisol."},{"category":"Salud mental","difficulty":"principiante","text":"Pedir ayuda a un profesional de salud mental es…","optionA":"Un signo de fortaleza y autocuidado","optionB":"Una debilidad","optionC":"Algo vergonzoso","correct":"A","explanation":"Romper el estigma salva vidas."},{"category":"Salud mental","difficulty":"principiante","text":"¿Cuál de estas acciones fortalece la salud mental?","optionA":"Mantener vínculos con amigos y familia","optionB":"Aislarse completamente","optionC":"Dormir 3 horas","correct":"A","explanation":"Las relaciones sociales son protectoras."},{"category":"Salud mental","difficulty":"principiante","text":"¿Qué es la empatía?","optionA":"Ignorar a los demás","optionB":"Ponerse en el lugar del otro y comprender sus sentimientos","optionC":"Competir siempre","correct":"B","explanation":"La empatía mejora la convivencia."},{"category":"Salud mental","difficulty":"principiante","text":"¿Qué deberías hacer si un amigo te cuenta que se siente muy triste?","optionA":"Cambiar de tema","optionB":"Decirle que exagera","optionC":"Escucharlo sin juzgar y animarlo a buscar ayuda","correct":"C","explanation":"Escuchar activamente es la primera ayuda."},{"category":"Salud mental","difficulty":"principiante","text":"¿Cuál es una emoción?","optionA":"El hígado","optionB":"La mesa","optionC":"La alegría","correct":"C","explanation":"Todas las emociones son válidas; lo importante es cómo las manejamos."},{"category":"Salud mental","difficulty":"principiante","text":"El bullying o acoso escolar…","optionA":"Es una broma inofensiva","optionB":"Daña la salud mental y debe denunciarse","optionC":"Fortalece el carácter","correct":"B","explanation":"El acoso tiene consecuencias graves y duraderas."},{"category":"Salud mental","difficulty":"principiante","text":"¿Qué es la autoestima?","optionA":"Un tipo de alimento","optionB":"La valoración que tenemos de nosotros mismos","optionC":"Una enfermedad","correct":"B","explanation":"Una autoestima sana nos protege ante la adversidad."},{"category":"Salud mental","difficulty":"medio","text":"¿Cuál es el trastorno mental más frecuente en el mundo?","optionA":"Depresión y trastornos de ansiedad","optionB":"Esquizofrenia","optionC":"Trastorno bipolar","correct":"A","explanation":"Más de 280 millones de personas viven con depresión."},{"category":"Salud mental","difficulty":"medio","text":"¿Qué es el 'burnout' o síndrome de desgaste profesional?","optionA":"Agotamiento por estrés laboral crónico","optionB":"Una quemadura solar","optionC":"Un tipo de gripe","correct":"A","explanation":"La OMS lo incluyó en la CIE-11 como fenómeno ocupacional."},{"category":"Salud mental","difficulty":"medio","text":"¿Qué técnica consiste en prestar atención plena al momento presente?","optionA":"Multitarea","optionB":"Procrastinación","optionC":"Mindfulness","correct":"C","explanation":"El mindfulness reduce la ansiedad y mejora la concentración."},{"category":"Salud mental","difficulty":"medio","text":"¿Cuándo se celebra el Día Mundial de la Salud Mental?","optionA":"1 de enero","optionB":"25 de diciembre","optionC":"10 de octubre","correct":"C","explanation":"Fue establecido por la Federación Mundial de Salud Mental."},{"category":"Salud mental","difficulty":"medio","text":"¿Qué hormona se conoce como 'hormona del estrés'?","optionA":"Cortisol","optionB":"Insulina","optionC":"Melatonina","correct":"A","explanation":"El cortisol elevado de forma crónica daña la salud."},{"category":"Salud mental","difficulty":"medio","text":"¿Qué es la resiliencia?","optionA":"Resistirse al cambio","optionB":"Capacidad de adaptarse y recuperarse ante la adversidad","optionC":"Evitar los problemas","correct":"B","explanation":"La resiliencia se puede fortalecer."},{"category":"Salud mental","difficulty":"medio","text":"¿Cuál es un signo de alarma de depresión?","optionA":"Estar triste un día","optionB":"Reírse mucho","optionC":"Tristeza persistente y pérdida de interés por más de dos semanas","correct":"C","explanation":"Ante estos signos, consultar con un profesional."},{"category":"Salud mental","difficulty":"medio","text":"¿Qué es el estigma en salud mental?","optionA":"Un tratamiento","optionB":"Un medicamento","optionC":"Prejuicio y discriminación hacia quienes tienen un trastorno mental","correct":"C","explanation":"El estigma impide que las personas busquen ayuda."},{"category":"Salud mental","difficulty":"medio","text":"¿Qué efecto tiene el uso excesivo de redes sociales en adolescentes?","optionA":"Siempre mejora la autoestima","optionB":"Puede aumentar ansiedad, comparación y problemas de sueño","optionC":"No tiene efecto","correct":"B","explanation":"El uso saludable implica límites de tiempo."},{"category":"Salud mental","difficulty":"medio","text":"¿Qué es la 'primera ayuda psicológica'?","optionA":"Un medicamento","optionB":"Una cirugía","optionC":"Apoyo humano básico a personas en crisis","correct":"C","explanation":"Escuchar, calmar y conectar con servicios de apoyo."},{"category":"Salud mental","difficulty":"medio","text":"Hablar sobre el suicidio con alguien en riesgo…","optionA":"Siempre empeora la situación","optionB":"Puede ayudar cial","correct":"C","explanation":"Es tratable con terapia cognitivo-conductual."},{"category":"Salud mental","difficulty":"avanzado","text":"¿Qué es la 'psicoeducación'?","optionA":"Brindar información para comprender y manejar la salud mental","optionB":"Educación física","optionC":"Un examen psicológico","correct":"A","explanation":"Empodera a pacientes y familias."},{"category":"Promoción de la salud","difficulty":"principiante","text":"¿Qué es la promoción de la salud?","optionA":"Proceso que permite a las personas aumentar el control sobre su salud y mejorarla","optionB":"Vender medicamentos","optionC":"Solo construir hospitales","correct":"A","explanation":"Definición de la Carta de Ottawa (1986)."},{"category":"Promoción de la salud","difficulty":"principiante","text":"¿Qué documento histórico define la promoción de la salud en 1986?","optionA":"Declaración de Independencia","optionB":"Carta de Ottawa","optionC":"Carta Magna","correct":"B","explanation":"Primera Conferencia Internacional sobre Promoción de la Salud."},{"category":"Promoción de la salud","difficulty":"principiante","text":"¿Cómo define la OMS la salud?","optionA":"Completo bienestar físico, mental y social, no solo ausencia de enfermedad","optionB":"No estar enfermo","optionC":"Tener dinero","correct":"A","explanation":"Definición de la Constitución de la OMS (1946)."},{"category":"Promoción de la salud","difficulty":"principiante","text":"¿Quién es responsable de la promoción de la salud?","optionA":"Solo los médicos","optionB":"Toda la sociedad: gobierno, comunidad e individuos","optionC":"Solo los hospitales","correct":"B","explanation":"La salud se construye en los entornos cotidianos."},{"category":"Promoción de la salud","difficulty":"principiante","text":"¿Cuál es un 'estilo de vida saludable'?","optionA":"Fumar poco","optionB":"Alimentación equilibrada, actividad física, descanso y sin tabaco","optionC":"Comer solo de noche","correct":"B","explanation":"Los hábitos diarios determinan gran parte de la salud."},{"category":"Promoción de la salud","difficulty":"principiante","text":"¿Qué es un 'entorno saludable'?","optionA":"Solo un hospital","optionB":"Espacio que favorece la salud: escuela, trabajo, barrio","optionC":"Un lugar cerrado","correct":"B","explanation":"Los entornos saludables facilitan las decisiones sanas."},{"category":"Promoción de la salud","difficulty":"principiante","text":"¿Qué es el autocuidado?","optionA":"Esperar a enfermarse","optionB":"Automedicarse","optionC":"Acciones que una persona realiza para cuidar su propia salud","correct":"C","explanation":"El autocuidado es la base de la promoción de la salud."},{"category":"Promoción de la salud","difficulty":"principiante","text":"¿Qué institución en Paraguay rectora la salud pública?","optionA":"Ministerio de Hacienda","optionB":"Ministerio de Obras","optionC":"Ministerio de Salud Pública y Bienestar Social","correct":"C","explanation":"El MSPBS es la autoridad sanitaria nacional."},{"category":"Promoción de la salud","difficulty":"principiante","text":"¿Cuándo se celebra el Día Mundial de la Salud?","optionA":"1 de mayo","optionB":"7 de abril","optionC":"31 de diciembre","correct":"B","explanation":"Conmemora la fundación de la OMS en 1948."},{"category":"Promoción de la salud","difficulty":"principiante","text":"Lavarse las manos con agua y jabón es…","optionA":"Innecesario","optionB":"Solo para médicos","optionC":"Una de las medidas más eficaces para prevenir enfermedades","correct":"C","explanation":"Previene diarreas e infecciones respiratorias."},{"category":"Promoción de la salud","difficulty":"medio","text":"¿Cuántas áreas de acción establece la Carta de Ottawa?","optionA":"Dos","optionB":"Diez","optionC":"Cinco","correct":"C","explanation":"Políticas públicas, entornos, acción comunitaria, aptitudes personales y reorientación de servicios."},{"category":"Promoción de la salud","difficulty":"medio","text":"¿Cuál NO es un área de acción de la Carta de Ottawa?","optionA":"Construir más hospitales privados","optionB":"Crear entornos favorables","optionC":"Reforzar la acción comunitaria","correct":"A","explanation":"La Carta propone reorientar los servicios, no solo construirlos."},{"category":"Promoción de la salud","difficulty":"medio","text":"¿Qué son los determinantes sociales de la salud?","optionA":"Solo los genes","optionB":"Condiciones en que las personas nacen, crecen, viven, trabajan y envejecen","optionC":"Solo los virus","correct":"B","explanation":"Explican gran parte de las desigualdades en salud."},{"category":"Promoción de la salud","difficulty":"medio","text":"¿Qué significa 'empoderamiento' en promoción de la salud?","optionA":"Que las personas y comunidades ganen control sobre las decisiones que afectan su salud","optionB":"Dar poder solo a los médicos","optionC":"Imponer normas","correct":"A","explanation":"Es un principio central de la promoción."},{"category":"Promoción de la salud","difficulty":"medio","text":"¿Qué es la prevención primaria?","optionA":"Evitar que aparezca la enfermedad (ej. vacunas)","optionB":"Tratar la enfermedad avanzada","optionC":"Rehabilitar secuelas","correct":"A","explanation":"Primaria: evitar; secundaria: detectar temprano; terciaria: rehabilitar."},{"category":"Promoción de la salud","difficulty":"medio","text":"¿Qué es la prevención secundaria?","optionA":"Vacunación","optionB":"Detección temprana (ej. mamografía, PAP)","optionC":"Rehabilitación","correct":"B","explanation":"Busca diagnosticar antes de que aparezcan síntomas graves."},{"category":"Promoción de la salud","difficulty":"medio","text":"¿Qué es la 'abogacía' (advocacy) en salud?","optionA":"Acciones para lograr compromiso político y apoyo social a favor de la salud","optionB":"Un juicio legal","optionC":"Un tipo de medicamento","correct":"A","explanation":"Es una de las tres estrategias básicas de Ottawa junto con facilitar y mediar."},{"category":"Promoción de la salud","difficulty":"medio","text":"¿Qué es la 'alfabetización en salud'?","optionA":"Saber leer","optionB":"Estudiar medicina","optionC":"Capacidad de obtener, comprender y usar información para tomar decisiones de salud","correct":"C","explanation":"Es un determinante clave de la salud."},{"category":"Promoción de la salud","difficulty":"medio","text":"¿Qué significa APS?","optionA":"Asociación de Pacientes Sanos","optionB":"Alta Presión Sanguínea","optionC":"Atención Primaria de la Salud","correct":"C","explanation":"Definida en Alma-Ata (1978) y renovada en Astaná (2018)."},{"category":"Promoción de la salud","difficulty":"medio","text":"¿En qué año se realizó la Conferencia de Alma-Ata sobre Atención Primaria?","optionA":"1945","optionB":"2010","optionC":"1978","correct":"C","explanation":"Lema: 'Salud para todos en el año 2000'."},{"category":"Promoción de la salud","difficulty":"medio","text":"¿Qué es la 'participación comunitaria' en salud?","optionA":"Que la comunidad solo reciba información","optionB":"Delegar todo al Estado","optionC":"Involucrar a la comunidad en identificar y resolver sus problemas de salud","correct":"C","explanation":"Fortalece la sostenibilidad de las acciones."},{"category":"Promoción de la salud","difficulty":"medio","text":"¿Qué es la 'educación para la salud'?","optionA":"Un posgrado médico","optionB":"Una campaña publicitaria","optionC":"Oportunidades de aprendizaje para mejorar conocimientos y habilidades en salud","correct":"C","explanation":"Es una herramienta clave de la promoción."},{"category":"Promoción de la salud","difficulty":"medio","text":"¿Qué enfoque considera la salud en todas las decisiones de gobierno?","optionA":"Solo políticas hospitalarias","optionB":"Salud en Todas las Políticas (STP)","optionC":"Política fiscal","correct":"B","explanation":"Promovido en la Declaración de Helsinki (2013)."},{"category":"Promoción de la salud","difficulty":"medio","text":"¿Qué son las ENT?","optionA":"Enfermedades No Transmisibles (diabetes, cáncer, cardiovasculares, respiratorias)","optionB":"Enfermedades Nuevas Tropicales","optionC":"Epidemias Nacionales Temporales","correct":"A","explanation":"Causan más del 70% de las muertes en el mundo."},{"category":"Promoción de la salud","difficulty":"medio","text":"¿Cuáles son los 4 factores de riesgo principales de las ENT?","optionA":"Tabaco, alcohol, mala alimentación e inactividad física","optionB":"Virus, bacterias, hongos y parásitos","optionC":"Frío, calor, lluvia y viento","correct":"A","explanation":"Todos son modificables con promoción de la salud."},{"category":"Promoción de la salud","difficulty":"avanzado","text":"¿Qué conferencia introdujo el concepto de 'entornos saludables' (settings)?","optionA":"Ottawa (1986)","optionB":"Bangkok (2005)","optionC":"Sundsvall (1991)","correct":"C","explanation":"Sundsvall: 'Entornos propicios para la salud'."},{"category":"Promoción de la salud","difficulty":"avanzado","text":"¿Qué conferencia de promoción de la salud se realizó en Shanghái en 2016?","optionA":"9ª Conferencia Mundial: Promoción de la salud en los ODS","optionB":"1ª Conferencia","optionC":"Conferencia de Alma-Ata","correct":"A","explanation":"Pilares: buena gobernanza, ciudades saludables y alfabetización en salud."},{"category":"Promoción de la salud","difficulty":"avanzado","text":"¿Qué documento de 1974 introdujo el concepto de 'campo de la salud' con 4 determinantes?","optionA":"Informe Lalonde (Canadá)","optionB":"Carta de Ottawa","optionC":"Informe Black","correct":"A","explanation":"Biología, ambiente, estilos de vida y sistema sanitario."},{"category":"Promoción de la salud","difficulty":"avanzado","text":"¿Qué conferencia se centró en 'Promoción de la salud en un mundo globalizado'?","optionA":"Yakarta (1997)","optionB":"Adelaida (1988)","optionC":"Bangkok (2005)","correct":"C","explanation":"La Carta de Bangkok actualizó Ottawa ante la globalización."},{"category":"Promoción de la salud","difficulty":"avanzado","text":"¿Qué conferencia abordó las 'Políticas públicas saludables'?","optionA":"Adelaida (1988)","optionB":"Nairobi (2009)","optionC":"México (2000)","correct":"A","explanation":"Segunda Conferencia Internacional."},{"category":"Promoción de la salud","difficulty":"avanzado","text":"¿Qué ODS se refiere específicamente a salud y bienestar?","optionA":"ODS 1","optionB":"ODS 3","optionC":"ODS 17","correct":"B","explanation":"Agenda 2030 de Naciones Unidas."},{"category":"Promoción de la salud","difficulty":"avanzado","text":"¿Cuál es la diferencia entre promoción y prevención?","optionA":"Son exactamente lo mismo","optionB":"La prevención es solo para niños","optionC":"Promoción fortalece la salud positiva; prevención evita enfermedades específicas","correct":"C","explanation":"Ambas se complementan."},{"category":"Promoción de la salud","difficulty":"avanzado","text":"¿Qué es la 'equidad en salud'?","optionA":"Que todos reciban exactamente lo mismo","optionB":"Igualdad de ingresos","optionC":"Ausencia de diferencias injustas y evitables en salud entre grupos","correct":"C","explanation":"Equidad implica dar más a quien más lo necesita."},{"category":"Promoción de la salud","difficulty":"avanzado","text":"¿Qué Declaración de 2018 renovó el compromiso con la APS?","optionA":"Declaración de Astaná","optionB":"Carta de Ottawa","optionC":"Declaración de Río","correct":"A","explanation":"40 años después de Alma-Ata."},{"category":"Promoción de la salud","difficulty":"avanzado","text":"¿Qué es la 'intersectorialidad'?","optionA":"Trabajo solo del sector salud","optionB":"Competencia entre ministerios","optionC":"Trabajo conjunto de distintos sectores (salud, educación, obras, etc.) por la salud","correct":"C","explanation":"Es esencial para abordar los determinantes sociales."},{"category":"Promoción de la salud","difficulty":"avanzado","text":"¿Qué es la 'salutogénesis' de Antonovsky?","optionA":"Estudio de las enfermedades","optionB":"Un tipo de vacuna","optionC":"Enfoque centrado en los factores que generan salud y bienestar","correct":"C","explanation":"Opuesto al enfoque patogénico tradicional."},{"category":"Promoción de la salud","difficulty":"avanzado","text":"¿Qué es el 'sentido de coherencia' en salutogénesis?","optionA":"Percepción de que la vida es comprensible, manejable y significativa","optionB":"Hablar con coherencia","optionC":"Un test de memoria","correct":"A","explanation":"Es el eje del modelo de Antonovsky."},{"category":"Promoción de la salud","difficulty":"avanzado","text":"¿Qué modelo de cambio de conducta incluye las etapas precontemplación, contemplación, preparación, acción y mantenimiento?","optionA":"Modelo de creencias en salud","optionB":"Modelo transteórico (Prochaska y DiClemente)","optionC":"Teoría del aprendizaje social","correct":"B","explanation":"Útil para diseñar intervenciones de hábitos."},{"category":"Municipio Saludable","difficulty":"principiante","text":"¿Qué es un Municipio Saludable?","optionA":"Un municipio que trabaja de forma participativa para mejorar la calidad de vida de su gente","optionB":"Un municipio sin hospitales","optionC":"Un municipio donde nadie se enferma","correct":"A","explanation":"La estrategia promueve entornos y políticas locales saludables."},{"category":"Municipio Saludable","difficulty":"principiante","text":"¿Quién lidera la estrategia de Municipio Saludable a nivel local?","optionA":"La Intendencia/Municipalidad junto a la comunidad y el sector salud","optionB":"Solo el hospital","optionC":"Una empresa privada","correct":"A","explanation":"El gobierno local es el actor central."},{"category":"Municipio Saludable","difficulty":"principiante","text":"¿Cuál es un ejemplo de acción de Municipio Saludable?","optionA":"Crear plazas, ciclovías y ferias de alimentos saludables","optionB":"Instalar más locales de comida rápida","optionC":"Reducir los espacios verdes","correct":"A","explanation":"Los entornos urbanos influyen en la salud."},{"category":"Municipio Saludable","difficulty":"principiante","text":"¿Qué se necesita para que un municipio sea saludable?","optionA":"Solo dinero","optionB":"Participación de la comunidad","optionC":"Que no haya niños","correct":"B","explanation":"Sin participación no hay sostenibilidad."},{"category":"Municipio Saludable","difficulty":"principiante","text":"¿Qué beneficio trae una plaza bien cuidada al barrio?","optionA":"Ninguno","optionB":"Promueve actividad física, recreación y encuentro social","optionC":"Aumenta la contaminación","correct":"B","explanation":"Los espacios públicos son determinantes de salud."},{"category":"Municipio Saludable","difficulty":"principiante","text":"¿Quiénes pueden participar en la mesa de trabajo del Municipio Saludable?","optionA":"Solo el intendente","optionB":"Autoridades, organizaciones, escuelas, iglesias, vecinos y servicios de salud","optionC":"Solo médicos","correct":"B","explanation":"Es un espacio intersectorial y participativo."},{"category":"Municipio Saludable","difficulty":"principiante","text":"Separar la basura y mantener limpia la comunidad es parte de…","optionA":"Un problema ajeno","optionB":"Una moda pasajera","optionC":"Un entorno saludable","correct":"C","explanation":"La basura acumulada favorece el dengue y otras enfermedades."},{"category":"Municipio Saludable","difficulty":"medio","text":"¿Cuál es el primer paso para implementar la estrategia de Municipio Saludable?","optionA":"Hacer una fiesta","optionB":"Construir un hospital","optionC":"Compromiso político formal de las autoridades municipales","correct":"C","explanation":"La voluntad política es el punto de partida."},{"category":"Municipio Saludable","difficulty":"medio","text":"¿Qué instrumento se recomienda para conocer la situación de salud del municipio?","optionA":"Una encuesta de televisión","optionB":"Diagnóstico participativo o análisis de situación de salud local","optionC":"Un censo de mascotas","correct":"B","explanation":"Permite priorizar problemas con la comunidad."},{"category":"Municipio Saludable","difficulty":"medio","text":"¿Qué documento ordena las acciones del Municipio Saludable con objetivos, plazos y responsables?","optionA":"Un acta de nacimiento","optionB":"Una lista de compras","optionC":"Plan Municipal de Salud (plan de acción)","correct":"C","explanation":"El plan debe ser elaborado participativamente."},{"category":"Municipio Saludable","difficulty":"medio","text":"¿Qué es una ordenanza municipal saludable?","optionA":"Norma local que protege la salud (ej. espacios libres de humo, kioscos saludables)","optionB":"Una receta médica","optionC":"Un impuesto","correct":"A","explanation":"Las ordenanzas son herramientas de política pública saludable."},{"category":"Municipio Saludable","difficulty":"medio","text":"¿Qué estructura local se conforma para coordinar la estrategia?","optionA":"Un club de fútbol","optionB":"Comité o Mesa Intersectorial de Municipio Saludable","optionC":"Una comisión de fiestas","correct":"B","explanation":"Integra a distintos sectores y a la comunidad."},{"category":"Municipio Saludable","difficulty":"medio","text":"¿Qué rol cumplen los Consejos Locales de Salud en Paraguay?","optionA":"Participación ciudadana en la gestión local de salud","optionB":"Solo recaudar impuestos","optionC":"Vender medicamentos","correct":"A","explanation":"Creados por la Ley 1032/96 del Sistema Nacional de Salud."},{"category":"Municipio Saludable","difficulty":"medio","text":"¿Qué son las 'escuelas saludables' dentro de un municipio?","optionA":"Escuelas solo de medicina","optionB":"Escuelas sin recreos","optionC":"Escuelas que promueven alimentación sana, actividad física y bienestar","correct":"C","explanation":"El entorno escolar es clave para formar hábitos."},{"category":"Municipio Saludable","difficulty":"medio","text":"¿Por qué es importante el monitoreo y evaluación en la estrategia?","optionA":"Para medir avances, ajustar acciones y rendir cuentas","optionB":"No es importante","optionC":"Solo para castigar","correct":"A","explanation":"Los indicadores permiten demostrar resultados."},{"category":"Municipio Saludable","difficulty":"medio","text":"¿Qué es un 'kiosco o cantina saludable'?","optionA":"Un lugar solo de golosinas","optionB":"Expendio escolar que ofrece alimentos nutritivos y limita ultraprocesados","optionC":"Una farmacia","correct":"B","explanation":"Paraguay regula las cantinas escolares saludables."},{"category":"Municipio Saludable","difficulty":"medio","text":"¿Cuál es un indicador útil para un Municipio Saludable?","optionA":"Cantidad de autos","optionB":"Porcentaje de escuelas con cantinas saludables","optionC":"Número de televisores","correct":"B","explanation":"Los indicadores deben relacionarse con determinantes de salud."},{"category":"Municipio Saludable","difficulty":"medio","text":"¿Qué organismo internacional impulsa el movimiento de Municipios y Comunidades Saludables en las Américas?","optionA":"FIFA","optionB":"FMI","optionC":"OPS/OMS","correct":"C","explanation":"La OPS promueve la estrategia desde los años 90."},{"category":"Municipio Saludable","difficulty":"avanzado","text":"¿Cuáles son las fases típicas de la Guía de Implementación de Municipio Saludable?","optionA":"Compra, venta y entrega","optionB":"Sensibilización y compromiso, organización, diagnóstico, planificación, ejecución, monitoreo y evaluación","optionC":"Solo diagnóstico","correct":"B","explanation":"Es un proceso cíclico y participativo."},{"category":"Municipio Saludable","difficulty":"avanzado","text":"¿Qué significa 'acreditación' o 'certificación' de un Municipio Saludable?","optionA":"Un título universitario","optionB":"Reconocimiento al cumplir criterios y evidencias de la estrategia","optionC":"Un permiso de construcción","correct":"B","explanation":"Motiva la mejora continua."},{"category":"Municipio Saludable","difficulty":"avanzado","text":"¿Qué enfoque transversal debe considerar el plan de Municipio Saludable?","optionA":"Solo enfoque económico","optionB":"Derechos humanos, género, interculturalidad y curso de vida","optionC":"Solo enfoque médico","correct":"B","explanation":"Garantiza equidad e inclusión."},{"category":"Municipio Saludable","difficulty":"avanzado","text":"¿Qué es un 'mapa de actores' en la fase de organización?","optionA":"Un mapa turístico","optionB":"Identificación de personas e instituciones clave y su nivel de influencia","optionC":"Un plano de calles","correct":"B","explanation":"Permite planificar alianzas."},{"category":"Municipio Saludable","difficulty":"avanzado","text":"¿Qué es la 'línea de base' en el plan municipal?","optionA":"Medición inicial de indicadores para comparar los avances","optionB":"La última medición","optionC":"Una línea de autobús","correct":"A","explanation":"Sin línea de base no se puede evaluar impacto."},{"category":"Municipio Saludable","difficulty":"avanzado","text":"¿Cuál fue la primera ciudad en adoptar formalmente el movimiento 'Ciudades Saludables' promovido por la OMS Europa?","optionA":"Tokio 1920","optionB":"Asunción 1950","optionC":"Toronto/Movimiento iniciado en 1986 en Europa (Lisboa como sede)","correct":"C","explanation":"El movimiento Healthy Cities nació en 1986."},{"category":"Municipio Saludable","difficulty":"avanzado","text":"¿Qué ley en Paraguay crea el Sistema Nacional de Salud y los Consejos de Salud?","optionA":"Ley 1032/96","optionB":"Ley 100/10","optionC":"Ley 5000/20","correct":"A","explanation":"Establece la descentralización y participación."},{"category":"Municipio Saludable","difficulty":"avanzado","text":"¿Qué es el 'presupuesto participativo' en el contexto de Municipio Saludable?","optionA":"El sueldo del intendente","optionB":"Un préstamo bancario","optionC":"Mecanismo donde la comunidad decide parte de la inversión municipal","correct":"C","explanation":"Fortalece la gobernanza y la transparencia."},{"category":"Municipio Saludable","difficulty":"avanzado","text":"¿Qué dimensión evalúa si las acciones continúan luego de cambios de gobierno?","optionA":"Eficiencia","optionB":"Cobertura","optionC":"Sostenibilidad","correct":"C","explanation":"La institucionalización por ordenanza favorece la sostenibilidad."},{"category":"Prevención de enfermedades","difficulty":"principiante","text":"¿Cómo se transmite el dengue?","optionA":"Por la picadura del mosquito Aedes aegypti","optionB":"Por el aire","optionC":"Por tomar agua fría","correct":"A","explanation":"Eliminar criaderos es la mejor prevención."},{"category":"Prevención de enfermedades","difficulty":"principiante","text":"¿Qué debemos hacer para prevenir el dengue en casa?","optionA":"Eliminar recipientes con agua estancada","optionB":"Dejar baldes con agua","optionC":"Acumular neumáticos","correct":"A","explanation":"Sin criaderos no hay mosquitos."},{"category":"Prevención de enfermedades","difficulty":"principiante","text":"¿Para qué sirven las vacunas?","optionA":"Para curar fracturas","optionB":"Para engordar","optionC":"Para prevenir enfermedades infecciosas","correct":"C","explanation":"Las vacunas salvan millones de vidas cada año."},{"category":"Prevención de enfermedades","difficulty":"principiante","text":"¿Cómo debemos cubrirnos al toser o estornudar?","optionA":"Con la mano","optionB":"No hace falta cubrirse","optionC":"Con el pliegue del codo","correct":"C","explanation":"Evita la propagación de gérmenes."},{"category":"Prevención de enfermedades","difficulty":"principiante","text":"¿Cuánto tiempo debe durar el lavado de manos con jabón?","optionA":"2 segundos","optionB":"Al menos 20 segundos","optionC":"10 minutos","correct":"B","explanation":"Lo que dura cantar 'Feliz cumpleaños' dos veces."},{"category":"Prevención de enfermedades","difficulty":"principiante","text":"¿Qué protege la piel del sol?","optionA":"Protector solar, sombrero y sombra","optionB":"Aceite de cocina","optionC":"Nada","correct":"A","explanation":"Evitar el sol entre 10 y 16 h previene cáncer de piel."},{"category":"Prevención de enfermedades","difficulty":"principiante","text":"¿Cuántas veces al día debemos cepillarnos los dientes?","optionA":"1 vez por semana","optionB":"Nunca","optionC":"Al menos 2 veces, ideal después de cada comida","correct":"C","explanation":"El cepillado previene caries y enfermedad de encías."},{"category":"Prevención de enfermedades","difficulty":"principiante","text":"¿Qué enfermedad se previene con el uso del cinturón de seguridad?","optionA":"Gripe","optionB":"Diabetes","optionC":"Lesiones graves por accidentes de tránsito","correct":"C","explanation":"Los siniestros viales son una causa principal de muerte en jóvenes."},{"category":"Prevención de enfermedades","difficulty":"principiante","text":"¿Qué debemos hacer con los alimentos para prevenir intoxicaciones?","optionA":"Dejarlos al sol","optionB":"Comerlos vencidos","optionC":"Lavarlos, cocinarlos bien y refrigerarlos","correct":"C","explanation":"Las 5 claves de la OMS para la inocuidad de los alimentos."},{"category":"Prevención de enfermedades","difficulty":"principiante","text":"¿Qué animal transmite la rabia?","optionA":"Peces","optionB":"Mariposas","optionC":"Perros, gatos y murciélagos no vacunados","correct":"C","explanation":"Vacunar a las mascotas es obligatorio y protege a todos."},{"category":"Prevención de enfermedades","difficulty":"medio","text":"¿Cuál es el valor normal de presión arterial en un adulto?","optionA":"Menos de 120/80 mmHg","optionB":"160/100 mmHg","optionC":"200/120 mmHg","correct":"A","explanation":"La hipertensión suele ser silenciosa: ¡medila!"},{"category":"Prevención de enfermedades","difficulty":"medio","text":"¿Qué examen detecta tempranamente el cáncer de cuello uterino?","optionA":"Radiografía de tórax","optionB":"Papanicolaou (PAP)","optionC":"Electrocardiograma","correct":"B","explanation":"Se recomienda desde los 25 años en mujeres."},{"category":"Prevención de enfermedades","difficulty":"medio","text":"¿Qué estudio se usa para detectar el cáncer de mama?","optionA":"Mamografía","optionB":"Ecografía abdominal","optionC":"Examen de orina","correct":"A","explanation":"Se recomienda en general a partir de los 40-50 años."},{"category":"Prevención de enfermedades","difficulty":"medio","text":"¿Qué valor de glucosa en ayunas indica diabetes?","optionA":"126 mg/dl o más","optionB":"70 mg/dl","optionC":"90 mg/dl","correct":"A","explanation":"Entre 100 y 125 se considera prediabetes."},{"category":"Prevención de enfermedades","difficulty":"medio","text":"¿Qué vacuna previene el cáncer de cuello uterino?","optionA":"Vacuna BCG","optionB":"Vacuna contra el VPH","optionC":"Vacuna antitetánica","correct":"B","explanation":"Se aplica a niñas y niños desde los 9 años."},{"category":"Prevención de enfermedades","difficulty":"medio","text":"¿Cuál es la principal causa de muerte en el mundo?","optionA":"Enfermedades cardiovasculares","optionB":"Accidentes de avión","optionC":"Picaduras de insectos","correct":"A","explanation":"Infartos y ACV son las primeras causas."},{"category":"Prevención de enfermedades","difficulty":"medio","text":"¿Qué síntoma puede indicar un accidente cerebrovascular (ACV)?","optionA":"Dolor de rodilla","optionB":"Hambre","optionC":"Debilidad súbita de un lado del cuerpo y dificultad para hablar","correct":"C","explanation":"Ante estos signos, llamar a emergencias de inmediato."},{"category":"Prevención de enfermedades","difficulty":"medio","text":"¿Qué medida reduce la transmisión de enfermedades respiratorias?","optionA":"Ventilar los ambientes y lavarse las manos","optionB":"Cerrar todas las ventanas","optionC":"Compartir vasos","correct":"A","explanation":"El aire renovado reduce la carga viral."},{"category":"Prevención de enfermedades","difficulty":"medio","text":"¿Qué es el chikungunya?","optionA":"Enfermedad viral transmitida por Aedes con fiebre y dolor articular intenso","optionB":"Una bacteria del agua","optionC":"Una enfermedad de la piel por hongos","correct":"A","explanation":"Comparte el vector del dengue."},{"category":"Prevención de enfermedades","difficulty":"medio","text":"¿Qué enfermedad se previene mediante el control de la glucosa, presión y colesterol?","optionA":"Varicela","optionB":"Enfermedad cardiovascular","optionC":"Sarampión","correct":"B","explanation":"Son los 'tres números' que todo adulto debería conocer."},{"category":"Prevención de enfermedades","difficulty":"medio","text":"¿Qué es la obesidad?","optionA":"Acumulación excesiva de grasa que perjudica la salud (IMC ≥ 30)","optionB":"Tener músculos grandes","optionC":"Ser alto","correct":"A","explanation":"Es un factor de riesgo de múltiples ENT."},{"category":"Prevención de enfermedades","difficulty":"medio","text":"¿Qué medida de cintura indica riesgo cardiometabólico aumentado en mujeres?","optionA":"Más de 88 cm","optionB":"Menos de 60 cm","optionC":"Más de 50 cm","correct":"A","explanation":"En hombres el límite es 102 cm."},{"category":"Prevención de enfermedades","difficulty":"medio","text":"¿Qué prueba rápida permite conocer si una persona tiene VIH?","optionA":"Test rápido de VIH","optionB":"Radiografía","optionC":"Tomografía","correct":"A","explanation":"Es gratuito y confidencial en los servicios públicos."},{"category":"Prevención de enfermedades","difficulty":"medio","text":"¿Qué enfermedad transmitida por alimentos se previene cocinando bien la carne?","optionA":"Gripe","optionB":"Asma","optionC":"Salmonelosis y otras infecciones","correct":"C","explanation":"Cocinar por encima de 70°C elimina la mayoría de los patógenos."},{"category":"Prevención de enfermedades","difficulty":"avanzado","text":"¿Qué porcentaje de los cánceres podrían prevenirse modificando factores de riesgo?","optionA":"Entre 30% y 50%","optionB":"0%","optionC":"100%","correct":"A","explanation":"Tabaco, alcohol, dieta e inactividad son los principales."},{"category":"Prevención de enfermedades","difficulty":"avanzado","text":"¿Qué valor de hemoglobina glicosilada (HbA1c) diagnostica diabetes?","optionA":"6,5% o más","optionB":"4%","optionC":"2%","correct":"A","explanation":"Refleja el promedio de n":"Contienen nicotina y sustancias tóxicas."},{"category":"Tabaco y alcohol","difficulty":"principiante","text":"¿Cuándo se celebra el Día Mundial Sin Tabaco?","optionA":"1 de enero","optionB":"31 de mayo","optionC":"15 de agosto","correct":"B","explanation":"Instituido por la OMS."},{"category":"Tabaco y alcohol","difficulty":"medio","text":"¿Qué sustancia del tabaco produce la adicción?","optionA":"Nicotina","optionB":"Agua","optionC":"Calcio","correct":"A","explanation":"La nicotina es tan adictiva como otras drogas."},{"category":"Tabaco y alcohol","difficulty":"medio","text":"¿Cuántas sustancias químicas contiene aproximadamente el humo del tabaco?","optionA":"10","optionB":"Más de 7.000, al menos 70 cancerígenas","optionC":"100","correct":"B","explanation":"Incluye alquitrán, monóxido de carbono y arsénico."},{"category":"Tabaco y alcohol","difficulty":"medio","text":"¿Qué beneficio ocurre 20 minutos después de dejar de fumar?","optionA":"Ninguno","optionB":"Aumenta el peso","optionC":"Baja la presión arterial y la frecuencia cardíaca","correct":"C","explanation":"Los beneficios de dejar de fumar comienzan de inmediato."},{"category":"Tabaco y alcohol","difficulty":"medio","text":"¿Qué tratado internacional busca controlar el tabaco?","optionA":"Tratado de Versalles","optionB":"Protocolo de Kioto","optionC":"Convenio Marco de la OMS para el Control del Tabaco","correct":"C","explanation":"Paraguay lo ratificó en 2006."},{"category":"Tabaco y alcohol","difficulty":"medio","text":"¿Qué órgano se daña principalmente por el consumo crónico de alcohol?","optionA":"Uñas","optionB":"Hígado (cirrosis)","optionC":"Cabello","correct":"B","explanation":"También afecta cerebro, corazón y páncreas."},{"category":"Tabaco y alcohol","difficulty":"medio","text":"¿Qué es el 'consumo episódico excesivo' (binge drinking)?","optionA":"Beber 5 o más tragos en una ocasión","optionB":"Tomar una copa de vino al mes","optionC":"No beber","correct":"A","explanation":"Es el patrón más io","text":"¿Por qué es importante la higiene en la preparación de alimentos?","optionA":"Solo mejora el aspecto","optionB":"Previene infecciones transmitidas por alimentos","optionC":"No tiene relación con la salud","correct":"B","explanation":"Manos, superficies y utensilios limpios son clave."},{"category":"Prevención de enfermedades","difficulty":"medio","text":"¿Qué medida reduce el riesgo de accidentes en el hogar con niños pequeños?","optionA":"Dejar objetos peligrosos al alcance","optionB":"Permitir subir a muebles altos","optionC":"Colocar protecciones en enchufes y ventanas","correct":"C","explanation":"Muchos accidentes infantiles son previsibles."},{"category":"Hábitos saludables","difficulty":"medio","text":"¿Qué es la higiene del sueño?","optionA":"Conjunto de hábitos que favorecen un buen descanso","optionB":"Lavar la ropa de cama a diario","optionC":"Dormir con la luz encendida","correct":"A","explanation":"Incluye horarios, ambiente y rutinas."},{"category":"Hábitos saludables","difficulty":"medio","text":"¿Qué ayuda a mantener la salud bucal?","optionA":"Cepillado con pasta con flúor y uso de hilo dental","optionB":"Comer golosinas entre comidas","optionC":"Cepillarse una vez por mes","correct":"A","explanation":"El flúor fortalece el esmalte."},{"category":"Hábitos saludables","difficulty":"medio","text":"¿Qué conviene hacer para prevenir lesiones al levantar objetos pesados?","optionA":"Inclinarse con las piernas rectas","optionB":"Levantar con un solo brazo","optionC":"Doblar las rodillas y mantener la espalda recta","correct":"C","explanation":"La técnica adecuada protege la columna."},{"category":"Hábitos saludables","difficulty":"medio","text":"¿Qué hábito favorece la salud visual en niños?","optionA":"Leer en la oscuridad","optionB":"Actividades al aire libre y limitar pantallas","optionC":"Ver TV a centímetros","correct":"B","explanation":"La luz natural ayuda a prevenir la miopía."},{"category":"Tabaco y alcohol","difficulty":"medio","text amentos","optionC":"Terapia de masajes","correct":"A","explanation":"Es una de las intervenciones con mayor evidencia."},{"category":"Salud mental","difficulty":"avanzado","text":"¿Qué factor de riesgo de suicidio es importante reconocer?","optionA":"Tener un perro","optionB":"Antecedentes de intentos previos","optionC":"Practicar deporte","correct":"B","explanation":"Reconocer señales permite intervenir a tiempo."},{"category":"Salud mental","difficulty":"avanzado","text":"¿Qué se conoce como 'apoyo entre pares'?","optionA":"Acompañamiento emocional brindado por personas que viven experiencias similares","optionB":"Cuidado solo médico","optionC":"Un tipo de medicina alternativa","correct":"A","explanation":"Es una estrategia comunitaria de salud mental."},{"category":"Prevención de enfermedades","difficulty":"avanzado","text":"¿Qué es la prevención de la transmisión vertical?","optionA":"Vacunar a los adultos","optionB":"Evitar que una enfermedad pase de madre a hijo durante el embarazo o parto","optionC":"Controlar la presión arterial","correct":"B","explanation":"Ejemplo: sífilis o VIH en embarazadas."},{"category":"Prevención de enfermedades","difficulty":"avanzado","text":"¿Qué estrategia se usa para la eliminación de la rabia humana en América Latina?","optionA":"Solo aislar a los perros","optionB":"Vacunar únicamente a turistas","optionC":"Vacunación canina y vigilancia de animales","correct":"C","explanation":"El control en animales domésticos es clave."},{"category":"Prevención de enfermedades","difficulty":"avanzado","text":"¿Qué es el tamizaje neonatal?","optionA":"Un examen de visión en adultos","optionB":"Un control dental","optionC":"Pruebas de laboratorio en recién nacidos para detectar enfermedades tratables","correct":"C","explanation":"Permite iniciar tratamiento temprano."},{"category":"Prevención de enfermedades","difficulty":"avanzado","text":"¿Qué factor de riesgo es prioritario para la enfermedad cardiovascular?","optionA":"Usar calzado cómodo r urbano de salud."},{"category":"Municipio Saludable","difficulty":"avanzado","text":"¿Qué instrumento permite priorizar intervenciones con criterios técnicos y participativos?","optionA":"Encuesta de opinión sobre fútbol","optionB":"Lista de precios","optionC":"Matriz de priorización de problemas","correct":"C","explanation":"Combina magnitud, gravedad y factibilidad."},{"category":"Municipio Saludable","difficulty":"avanzado","text":"¿Qué debe garantizar la participación comunitaria en el municipio?","optionA":"Que la comunidad solo asista a actos","optionB":"Que la comunidad tenga voz real en el diagnóstico y las decisiones","optionC":"Que nadie participe","correct":"B","explanation":"La participación significativa asegura pertinencia y sostenibilidad."},{"category":"Municipio Saludable","difficulty":"avanzado","text":"¿Qué es el 'ciclo de mejora continua' en un municipio saludable?","optionA":"Planificar, ejecutar, monitorear, evaluar y ajustar de forma permanente","optionB":"Hacer una sola actividad al año","optionC":"Eliminar los indicadores","correct":"A","explanation":"El ciclo PHVA es un enfoque clásico de gestión."},{"category":"Mitos y verdades","difficulty":"avanzado","text":"¿Cuál es la afirmación correcta sobre el consumo de sal?","optionA":"Cuanta más sal, mejor la salud","optionB":"Reducirla disminuye la presión arterial en la mayoría de las personas","optionC":"La sal no tiene efecto en la presión","correct":"B","explanation":"El exceso de sodio es un factor de riesgo cardiovascular."},{"category":"Mitos y verdades","difficulty":"avanzado","text":"¿Cuál es la afirmación correcta sobre la vacunación?","optionA":"Causa enfermedades graves con frecuencia","optionB":"No protege a la comunidad","optionC":"Es segura y eficaz, y sus eventos adversos graves son muy raros","correct":"C","explanation":"Las vacunas están sujetas a vigilancia continua de seguridad."},{"category":"Mitos y verdades","difficulty":"avanzado","text":"¿Cuál es la afirmación correcta         '<div class="avpick">' + AVATARS.map(function (a) {

        }).join("") + '</div></div>';
    }).join("");

      '<div class="glass slide"><p class="muted" style="margin-top:0">Cada jugador responde ' + settings.questionsPerTurn + ' preguntas (' + settings.secondsPerQuestion + ' s c/u) con un máximo de ' + Math.round(settings.secondsPerPlayer / 60) + ' min. ¡El mejor puntaje gana!</p>' +

  function vIntro() {
    var p = S.players[S.cur], lv = LEVELS.filter(function (l) { return l.id === S.diff; })[0];
    return '<div class="intro center pop"><p class="robo"><span class="robo-line">Turno ' + (S.cur + 1) + ' de ' + S.players.length + '</span></p>' +

      '<h2 style="font-size:36px;margin:0;color:#fff">' + esc(p.name) + '</h2>' +
      '<p class="muted">' + lv.emoji + ' Nivel ' + lv.label + ' · ' + settings.questionsPerTurn + ' preguntas · ' + settings.secondsPerQuestion + ' s cada una</p>' +
      '<button class="btn-neon pulse big" data-act="begin" style="margin-top:14px">¡Estoy listo!</button></div>';

  function vPlay(fb) {
    var p = S.players[S.cur], q = S.decks[S.cur][S.qi], ks = ["A", "B", "C"];
    var opts = ks.map(function (k) {
      var c = "opt";
      if (fb) { if (k === q.correct) c += " correct"; else if (S.sel === k) c += " wrong"; else c += " dim"; }
      return '<button class="' + c + '" ' + (fb ? "disabled" : "") + ' data-act="pick" data-v="' + k + '"><span class="tag">' + k + '</span><span>' + esc(q["option" + k]) + '</span></button>';
    }).join("");
    var msg = "";
    if (fb) {
      var ok = S.sel === q.correct;
      msg = '<div class="fb pop ' + (ok ? "good" : "bad") + '"><b>' +
        (ok ? "✅ ¡Correcto! +" + S.last + " pts" : S.sel === "TIMEOUT" ? "⏰ ¡Se acabó el tiempo!" : "❌ Incorrecto") + '</b>' +
        (q.explanation ? "<p>💡 " + esc(q.explanation) + "</p>" : "") + '</div>';
    }
    return '<div class="glass hud"><div class="who"><img src="' + avSrc(p.avatar) + '" alt=""><div style="min-width:0"><b>' + esc(p.name) + '</b>' +
      '<small>' + p.score + ' pts ' + (S.streak >= 2 ? '<span class="fire">🔥 x' + S.streak + '</span>' : "") + '</small></div></div>' +
      '<div class="mid"><small>Pregunta</small><b>' + (S.qi + 1) + '/' + settings.questionsPerTurn + '</b></div>' +
      '<div class="right"><small>Tiempo turno</small><b id="tt" class="mono">' + fmt(S.tt) + '</b></div></div>' +
      '<div class="qbar"><div class="track"><div id="bar" class="fill"></div></div><div id="qt" class="qt">' + S.qt + '</div></div>' +
      '<div class="glass qcard slide"><div class="meta"><span>' + (ICON[q.category] || "❓") + ' ' + esc(q.category) + '</span><span>' + esc(q.difficulty) + '</span></div>' +
      '<h2 class="qtext">' + esc(q.text) + '</h2><div class="opts">' + opts + '</div>' + msg + '</div>';
  }

  function updTimers() {
    var t = $("#tt"); if (t) t.textContent = fmt(S.tt);
    var q = $("#qt"); if (q) q.textContent = S.qt;
    var b = $("#bar");
    if (b) { b.style.width = (S.qt / settings.secondsPerQuestion * 100) + "%"; b.classList.toggle("danger", S.qt <= 4); }
    var qb = $("#qt"); if (qb) qb.style.color = S.qt <= 4 ? "#ff5577" : "";
  }

  var rankOf = function (arr) {
    return arr.slice().sort(function (a, b) { return b.score - a.score || b.correct - a.correct || a.timeMs - b.timeMs; });
  };

  function vTurnEnd() {
    var p = S.players[S.cur], rk = rankOf(S.players), last = S.cur + 1 >= S.players.length;
    return '<div class="intro center pop"><img class="bigav" style="width:170px;height:170px;margin-top:0" src="' + avSrc(p.avatar) + '" alt="">' +
      '<h2 style="margin:6px 0;color:#fff">¡Turno terminado, ' + esc(p.name) + '!</h2>' +
      '<div class="stats"><div><b>' + p.score + '</b><small>Puntos</small></div><div><b>' + p.correct + '/' + settings.questionsPerTurn + '</b><small>Aciertos</small></div><div><b>🔥 ' + p.streakMax + '</b><small>Mejor racha</small></div></div>' +
      '<div class="glass tbl"><p class="label" style="margin:0 0 6px">Tabla parcial</p>' +
        rk.map(function (x, i) { return '<div><span>' + (i + 1) + '. ' + esc(x.name) + '</span><b>' + x.score + ' pts</b></div>'; }).join("") + '</div>' +
      '<button class="btn-neon big" data-act="nextPlayer" style="margin-top:14px">' +
        (last ? "🏆 Ver resultados" : "Siguiente: " + esc(S.players[S.cur + 1].name) + " →") + '</button></div>';
  }

  function vFinal() {
    var rk = rankOf(S.players), lv = LEVELS.filter(function (l) { return l.id === S.diff; })[0];
    var pods = [1, 0, 2].map(function (pos) {
      var p = rk[pos];
      if (!p) return '<div class="pod"></div>';
      var h = [170, 125, 92][pos], medal = ["🥇", "🥈", "🥉"][pos];
      return '<div class="pod ' + (pos === 0 ? "first" : "") + ' pop"><img src="' + avSrc(p.avatar) + '" alt=""><b>' + esc(p.name) + '</b><small>' + p.score + ' pts</small>' +
        '<div class="step" style="height:' + h + 'px">' + medal + '</div></div>';
    }).join("");
    var conf = "";
    for (var c = 0; c < 60; c++) {
      conf += '<span class="confetti" style="left:' + (Math.random() * 100) + '%;background:' + ["#39ff14", "#00ffa3", "#ffffff", "#ffd400", "#ff3fa4"][c % 5] + ';animation-delay:' + (Math.random() * 1.5) + 's;animation-duration:' + (2.5 + Math.random() * 2) + 's"></span>';
    }

      '<h2 class="logo" style="font-size:clamp(30px,6vw,52px);margin:10px 0"><span class="neon">¡' + esc(rk[0].name) + '</span> es el campeón!</h2>' +
      '<div class="podium">' + pods + '</div>' +
      '<div class="glass tbl" style="max-width:640px;margin:18px auto">' + rk.map(function (p, i) {
        return '<div class="rowi"><div class="l"><span class="n">' + (i + 1) + '</span><img src="' + avSrc(p.avatar) + '" alt=""><b>' + esc(p.name) + '</b></div>' +
          '<div class="s">' + p.score + ' pts <span class="muted" style="font-weight:600;font-size:12px">· ' + p.correct + '/' + settings.questionsPerTurn + ' ✓ · ' + Math.round(p.timeMs / 1000) + ' s</span></div></div>';
      }).join("") + '</div>' +
      '<div class="row" style="justify-content:center;margin-top:16px"><button class="btn-neon" data-act="go" data-v="setup">🔁 Jugar de nuevo</button>' +
      '<button class="btn-ghost" data-act="go" data-v="ranking">🏆 Ranking</button><button class="btn-ghost" data-act="go" data-v="menu">Menú</button></div></div>';
  }

  function vRanking() {
    var games = store.get(KEY.games, []);
    if (!games.length) {
      return header("Ranking") + '<div class="glass center" style="padding:40px"><p style="font-size:22px;font-weight:800;color:#fff">Todavía no hay partidas</p><p class="muted">¡Sé el primero en demostrar cuánto sabés de vida saludable!</p><button class="btn-neon" data-act="go" data-v="setup">▶ Jugar ahora</button></div>';
    }
    var best = [];
    games.forEach(function (g) { g.players.forEach(function (p) { best.push({ name: p.name, avatar: p.avatar, score: p.score, correct: p.correct, difficulty: g.difficulty }); }); });
    best.sort(function (a, b) { return b.score - a.score; });
    var wins = {};
    games.forEach(function (g) {
      var k = g.winner;
      var pl = g.players.filter(function (p) { return p.name === k; })[0];
      wins[k] = wins[k] || { name: k, avatar: pl ? pl.avatar : "manzana", n: 0 };
      wins[k].n++;
    });
    var champs = Object.keys(wins).map(function (k) { return wins[k]; }).sort(function (a, b) { return b.n - a.n; }).slice(0, 10);
    return header("Ranking") +
      '<div class="cols2"><div class="glass"><p class="label">Mejores puntajes</p>' +
      best.slice(0, 10).map(function (p, i) {
        return '<div class="rowi"><div class="l"><span class="n">' + (i + 1) + '</span><img src="' + avSrc(p.avatar) + '" alt=""><div style="min-width:0"><b>' + esc(p.name) + '</b><div class="muted" style="font-size:11px;text-transform:uppercase">' + esc(p.difficulty) + ' · ' + p.correct + ' aciertos</div></div></div><div class="s neon" style="font-size:18px">' + p.score + '</div></div>';
      }).join("") + '</div>' +
      '<div class="glass"><p class="label">Campeones (victorias)</p>' +
      champs.map(function (c, i) {
        return '<div class="rowi"><div class="l"><span style="font-size:20px">' + (["🥇", "🥈", "🥉"][i] || "🏅") + '</span><img src="' + avSrc(c.avatar) + '" alt=""><b>' + esc(c.name) + '</b></div><div class="s">' + c.n + ' ' + (c.n === 1 ? "victoria" : "victorias") + '</div></div>';
      }).join("") +
      '<p class="label" style="margin-top:18px">Últimas partidas</p>' +
      games.slice(0, 8).map(function (g) {
        return '<div class="rowi"><span>👑 <b>' + esc(g.winner) + '</b> <span class="muted" style="font-size:12px">· ' + g.players.length + ' jug. · ' + esc(g.difficulty) + '</span></span><span class="muted" style="font-size:11px">' + new Date(g.date).toLocaleDateString("es-PY") + '</span></div>';
      }).join("") + '</div></div>';
  }

      '<div class="glass" style="text-align:center">' +
      '<div style="font-size:46px">🔒</div>' +
      '<h2 style="margin:6px 0;color:#fff;font-size:26px">Acceso restringido</h2>' +

        '<label class="field"><span>¿Los jugadores pueden elegir el nivel?</span><select id="c-choose" class="select"><option value="1" ' + (settings.allowDifficultyChoice ? "selected" : "") + '>Sí, pueden elegir</option><option value="0" ' + (!settings.allowDifficultyChoice ? "selected" : "") + '>No, usar el nivel por defecto</option></select></label>' +

        '<label class="field"><span>Categoría</span><input id="n-cat" class="input" list="cats" value="Alimentación"><datalist id="cats">' + Object.keys(ICON).map(function (c) { return '<option value="' + esc(c) + '">'; }).join("") + '</datalist></label>' +
        '<label class="field"><span>Nivel</span><select id="n-lvl" class="select">' + LEVELS.map(function (l) { return '<option value="' + l.id + '">' + l.label + '</option>'; }).join("") + '</select></label>' +
        '<label class="field full"><span>Pregunta</span><textarea id="n-text" class="textarea" rows="2"></textarea></label>' +
        '<label class="field"><span>Opción A</span><input id="n-a" class="input"></label>' +
        '<label class="field"><span>Opción B</span><input id="n-b" class="input"></label>' +
        '<label class="field"><span>Opción C</span><input id="n-c" class="input"></label>' +
        '<label class="field"><span>Respuesta correcta</span><select id="n-ok" class="select"><option>A</option><option>B</option><option>C</option></select></label>' +
        '<label class="field full"><span>Explicación (opcional)</span><input id="n-ex" class="input"></label>' +
        '</div><button class="btn-neon" data-act="addQ" style="margin-top:16px">➕ Guardar pregunta</button></div>';

        '<select id="bl" class="select" style="max-width:220px"><option value="">Todos los niveles</option>' + LEVELS.map(function (l) { return '<option value="' + l.id + '" ' + (S.admin.lvl === l.id ? "selected" : "") + '>' + l.label + '</option>'; }).join("") + '</select>' +

  function renderList() {
    var el = $("#list"); if (!el) return;
    var q = S.admin.q.toLowerCase();
    var rows = bank.filter(function (x) {
      return (!S.admin.lvl || x.difficulty === S.admin.lvl) && (!q || (x.text + " " + x.category).toLowerCase().indexOf(q) >= 0);
    }).slice().sort(function (a, b) { return b.id - a.id; });
    var pages = Math.max(1, Math.ceil(rows.length / 25));
    S.admin.page = Math.min(Math.max(1, S.admin.page), pages);
    var slice = rows.slice((S.admin.page - 1) * 25, S.admin.page * 25);
    el.innerHTML = '<p class="muted" style="font-size:13px">' + rows.length + ' resultados</p>' +
      slice.map(function (x) {
        return '<div class="item ' + (x.active ? "" : "off") + '"><small>#' + x.id + ' · ' + (ICON[x.category] || "❓") + ' ' + esc(x.category) + ' · ' + esc(x.difficulty) + '</small><b>' + esc(x.text) + '</b>' +
          '<div class="opts2">' + ["A", "B", "C"].map(function (k) { return '<span class="' + (x.correct === k ? "ok" : "") + '">' + k + ') ' + esc(x["option" + k]) + '</span>'; }).join("") + '</div>' +
          '<div class="row"><button class="btn-ghost sm" data-act="toggle" data-v="' + x.id + '">' + (x.active ? "Desactivar" : "Activar") + '</button>' +
          '<button class="btn-danger sm" data-act="del" data-v="' + x.id + '">Eliminar</button></div></div>';
      }).join("") +
      '<div class="row" style="justify-content:center;margin-top:10px"><button class="btn-ghost sm" data-act="pg" data-v="-1">←</button><span>Página ' + S.admin.page + ' / ' + pages + '</span><button class="btn-ghost sm" data-act="pg" data-v="1">→</button></div>';
  }

  /* ================= Render principal ================= */
  function render() {
    var map = { menu: vMenu, setup: vSetup, intro: vIntro, play: function () { return vPlay(false); }, feedback: function () { return vPlay(true); }, turnEnd: vTurnEnd, final: vFinal, ranking: vRanking, login: vLogin, admin: vAdmin };
    if (S.view === "admin" && !S.adminOk) { S.view = "login"; map.login = vLogin; }
    app.innerHTML = (map[S.view] || vMenu)();
    if (S.view === "admin") renderList();
    if (S.view === "final" && !S.saved) saveGame();
    if (S.prev !== S.view) window.scrollTo(0, 0);
    S.prev = S.view;
  }

  /* ================= Juego ================= */
  function startGame() {
    var ps = S.setup.slice(0, S.np).map(function (p, i) {
      return { name: (p.name || "").trim() || "Jugador " + (i + 1), avatar: p.avatar, score: 0, correct: 0, timeMs: 0, streakMax: 0 };
    });
    var base = bank.filter(function (q) { return q.active && q.difficulty === S.diff; });
    if (!base.length) { toast("No hay preguntas activas en este nivel", false); return; }
    var per = settings.questionsPerTurn, pool = shuffle(base);
    S.decks = ps.map(function () {
      var d = [];
      for (var j = 0; j < per; j++) { if (!pool.length) pool = shuffle(base); d.push(pool.shift()); }
      return d;
    });
    S.players = ps; S.cur = 0; S.saved = false; S.view = "intro";
    sfx("start");
    render();
  }

  function beginTurn() {
    S.qi = 0; S.streak = 0; S.sel = null;
    S.qt = settings.secondsPerQuestion; S.tt = settings.secondsPerPlayer;
    S.turnStart = Date.now();
    S.view = "play";
    render();
    clearInterval(S.iv);
    S.iv = setInterval(tick, 1000);
  }

  function tick() {
    if (S.view !== "play") return;
    S.tt = Math.max(0, S.tt - 1);
    S.qt = Math.max(0, S.qt - 1);
    if (S.qt > 0 && S.qt <= 4) sfx("tick");
    updTimers();
    if (S.qt === 0 || S.tt === 0) answer(null);
  }

  function answer(opt) {
    if (S.view !== "play") return;
    var q = S.decks[S.cur][S.qi], ok = opt === q.correct;
    var pts = ok ? 100 + Math.round(S.qt / settings.secondsPerQuestion * 50) + Math.min(S.streak, 5) * 10 : 0;
    S.streak = ok ? S.streak + 1 : 0;
    S.last = pts; S.sel = opt || "TIMEOUT";
    var p = S.players[S.cur];
    p.score += pts; if (ok) p.correct++;
    p.streakMax = Math.max(p.streakMax, S.streak);
    sfx(ok ? "ok" : "bad");
    S.view = "feedback";
    render();
    clearTimeout(S.fb);
    S.fb = setTimeout(nextQ, 1900);
  }

  function nextQ() {
    if (S.view !== "feedback") return;
    if (S.qi + 1 >= settings.questionsPerTurn || S.tt <= 0) return endTurn();
    S.qi++; S.qt = settings.secondsPerQuestion; S.sel = null; S.view = "play";
    render();
  }

  function endTurn() {
    clearInterval(S.iv);
    S.players[S.cur].timeMs = Date.now() - S.turnStart;
    S.view = "turnEnd";
    render();
  }

  function saveGame() {
    S.saved = true;
    var g = store.get(KEY.games, []);
    g.unshift({ id: Date.now(), date: new Date().toISOString(), difficulty: S.diff, players: S.players, winner: rankOf(S.players)[0].name });
    store.set(KEY.games, g.slice(0, 200));
    sfx("win");
  }

  /* ================= Admin: acciones ================= */
  function parseImport(text) {
    var t = (text || "").trim(), out = [];
    if (!t) return out;
    if (t.charAt(0) === "[") {
      JSON.parse(t).forEach(function (x) { out.push(normalize(x)); });
    } else {
      t.split("\n").map(function (l) { return l.trim(); }).filter(Boolean).forEach(function (l) {
        var f = l.split("|").map(function (s) { return s.trim(); });
        var pos = Math.floor(Math.random() * 3), o = [f[4], f[5]];
        o.splice(pos, 0, f[3]);
        out.push(normalize({ difficulty: f[0], category: f[1], text: f[2], optionA: o[0], optionB: o[1], optionC: o[2], correct: "ABC".charAt(pos), explanation: f[6] }));
      });
    }
    return out.filter(function (x) { return x.text && x.optionA && x.optionB && x.optionC; });
  }
  function normalize(x) {
    return {
      category: String(x.category || "General").trim() || "General",
      difficulty: LEVELS.some(function (l) { return l.id === x.difficulty; }) ? x.difficulty : "principiante",
      text: String(x.text || "").trim(),
      optionA: String(x.optionA || "").trim(), optionB: String(x.optionB || "").trim(), optionC: String(x.optionC || "").trim(),
      correct: ["A", "B", "C"].indexOf(x.correct) >= 0 ? x.correct : "A",
      explanation: String(x.explanation || "").trim() || null
    };
  }
  function addRows(list) {
    var id = nextId();
    list.forEach(function (x) { bank.push(Object.assign({}, x, { id: id++, active: true })); });
    saveBank();
  }

  function saveCfg() {
    settings = {
      defaultDifficulty: $("#c-lvl").value,
      allowDifficultyChoice: $("#c-choose").value === "1",
      secondsPerQuestion: cl($("#c-sq").value, 5, 60, 16),
      secondsPerPlayer: cl($("#c-sp").value, 30, 600, 120),
      questionsPerTurn: cl($("#c-qt").value, 3, 30, 10)
    };
    store.set(KEY.settings, settings);
    S.diff = settings.defaultDifficulty;
    toast("Configuración guardada ✔");
    render();
  }

  function addOne() {
    var x = normalize({ category: $("#n-cat").value, difficulty: $("#n-lvl").value, text: $("#n-text").value, optionA: $("#n-a").value, optionB: $("#n-b").value, optionC: $("#n-c").value, correct: $("#n-ok").value, explanation: $("#n-ex").value });
    if (!x.text || !x.optionA || !x.optionB || !x.optionC) { toast("Completá la pregunta y las 3 opciones", false); return; }
    addRows([x]);
    toast("Pregunta agregada ✔");
    ["#n-text", "#n-a", "#n-b", "#n-c", "#n-ex"].forEach(function (s) { $(s).value = ""; });
  }

  function importNow() {
    var list;
    try { list = parseImport($("#imp").value); } catch (e) { toast("Formato inválido (JSON mal escrito)", false); return; }
    if (!list.length) { toast("No se encontraron preguntas válidas", false); return; }
    addRows(list);
    $("#imp").value = "";
    toast(list.length + " preguntas importadas ✔");
    render();
  }

  function exportBank() {
    var blob = new Blob([JSON.stringify(bank, null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "saludados-banco.json";
    document.body.appendChild(a); a.click(); a.remove();
  }

  /* ================= Eventos ================= */
  document.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest("[data-act]");
    if (!b || b.disabled) return;
    var a = b.getAttribute("data-act"), v = b.getAttribute("data-v");
    switch (a) {
      case "go":
        clearInterval(S.iv); clearTimeout(S.fb);
        S.view = v; render(); break;
      case "mute":
        S.muted = !S.muted; store.set(KEY.muted, S.muted); render(); break;
      case "np": S.np = Number(v); render(); break;
      case "diff": S.diff = v; render(); break;
      case "av": S.setup[Number(b.getAttribute("data-i"))].avatar = v; render(); break;
      case "start": startGame(); break;
      case "begin": beginTurn(); break;
      case "pick": answer(v); break;
      case "nextPlayer":
        if (S.cur + 1 < S.players.length) { S.cur++; S.view = "intro"; } else { S.view = "final"; }
        render(); break;
      case "adminLogin": {
        var f = $("#apw");
        var v2 = f ? f.value : "";
        if (v2 === ADMIN_PASS) {
          S.adminOk = true; store.set(KEY.adminok, true); S.adminPass = "";
          toast("Acceso concedido ✔"); S.view = "admin"; render();
        } else {
          var e = $("#aerr"); if (e) e.classList.remove("hide");
          if (f) { f.value = ""; f.focus(); }
        }
        break;
      }
      case "adminLogout":
        S.adminOk = false; store.set(KEY.adminok, false); S.view = "menu"; render(); break;
      case "tab": S.admin.tab = v; render(); break;
      case "saveCfg": saveCfg(); break;
      case "addQ": addOne(); break;
      case "importNow": importNow(); break;
      case "export": exportBank(); break;
      case "restore":
        if (confirm("¿Restaurar el banco original? Se perderán las preguntas agregadas en este dispositivo.")) {
          bank = seedRows(); saveBank(); toast("Banco original restaurado ✔"); render();
        }
        break;
      case "toggle":
        bank.forEach(function (q) { if (q.id === Number(v)) q.active = !q.active; });
        saveBank(); renderList(); break;
      case "del":
        if (confirm("¿Eliminar esta pregunta?")) { bank = bank.filter(function (q) { return q.id !== Number(v); }); saveBank(); render(); }
        break;
      case "pg": S.admin.page += Number(v); renderList(); break;
    }
  });

  document.addEventListener("input", function (e) {
    var t = e.target;
    if (t.getAttribute && t.getAttribute("data-field") === "name") S.setup[Number(t.getAttribute("data-i"))].name = t.value;
    if (t.id === "bq") { S.admin.q = t.value; S.admin.page = 1; renderList(); }
  });

  document.addEventListener("change", function (e) {
    var t = e.target;
    if (t.id === "bl") { S.admin.lvl = t.value; S.admin.page = 1; renderList(); }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && S.view === "login" && e.target && e.target.id === "apw") {
      var b = document.querySelector('[data-act="adminLogin"]'); if (b) b.click();
    }
    if (t.id === "imf" && t.files && t.files[0]) {
      var r = new FileReader();
      r.onload = function () { $("#imp").value = String(r.result); toast("Archivo cargado. Presioná Importar."); };
      r.readAsText(t.files[0]);
    }
  });

  // Evitar menú contextual en la app (modo escritorio/tablet)
  document.addEventListener("contextmenu", function (e) { if (!/INPUT|TEXTAREA/.test(e.target.tagName)) e.preventDefault(); });

  render();
})();
</script>
</body>
</html>
