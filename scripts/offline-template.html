.btn-neon{color:#031a08;background:linear-gradient(135deg,#39ff14,#00ffa3);box-shadow:0 0 16px rgba(57,255,20,.55),0 0 40px rgba(57,255,20,.22)}

.btn-ghost{color:#39ff14;background:rgba(57,255,20,.06);border:1px solid rgba(57,255,20,.5)}

.sm{padding:8px 14px;font-size:12px;border-radius:10px}
.big{padding:17px 34px;font-size:18px}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 10px rgba(57,255,20,.4)}50%{box-shadow:0 0 30px rgba(57,255,20,.95)}}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.center{text-align:center}
.muted{color:rgba(209,250,229,.7)}
.mono{font-family:"Courier New",ui-monospace,monospace}
.pop{animation:pop .4s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:none}}
.slide{animation:slide .3s ease both}
@keyframes slide{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.float{animation:float 3.5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.input,.select,.textarea{width:100%;background:rgba(5,15,10,.85);border:1px solid rgba(57,255,20,.3);color:#eafff0;border-radius:12px;padding:11px 13px;font:inherit;outline:none}
.input:focus,.select:focus,.textarea:focus{border-color:#39ff14;box-shadow:0 0 10px rgba(57,255,20,.4)}
select option{background:#07140c}
.textarea{min-height:110px;resize:vertical}
.field{display:block}
.field>span{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#6ee7a0;margin:0 0 6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.full{grid-column:1/-1}
.label{font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:#6ee7a0;margin:0 0 10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}

.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}

.ptitle{margin:0;font-size:20px;font-weight:900;color:#fff;text-align:center;flex:1}
.logo{font-size:clamp(46px,10vw,88px);line-height:1;margin:6px 0 4px;font-weight:900;letter-spacing:-.02em}

.av span{display:block;text-align:center;font-size:11px;font-weight:700;color:#a7f3c0;margin-top:3px}

.cats span{font-size:12px;border:1px solid rgba(57,255,20,.25);background:rgba(0,0,0,.35);border-radius:9px;padding:5px 10px}

.scroll{max-height:520px;overflow-y:auto;padding-right:4px}

.bigav{width:210px;height:210px;border-radius:26px;object-fit:cover;margin:18px auto;border:2px solid #39ff14;box-shadow:0 0 30px rgba(57,255,20,.5)}

.fire{color:#fdba74}
.qbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}

.qcard{padding:24px}

.qtext{font-size:clamp(19px,3.2vw,26px);line-height:1.3;margin:0;color:#fff}

.rowi{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid rgba(57,255,20,.12)}
.rowi:last-child{border:0}
.rowi .l{display:flex;align-items:center;gap:10px;min-width:0}
.rowi img{width:36px;height:36px;border-radius:10px;object-fit:cover}
.rowi .n{width:22px;font-weight:900;color:#6ee7a0}
.rowi b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowi .s{font-weight:900;color:#fff;text-align:right;font-size:14px;white-space:nowrap}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.confetti{position:fixed;top:-20px;width:9px;height:15px;z-index:50;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}

/* ---------- Admin ---------- */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tab{border:1px solid rgba(57,255,20,.3);background:transparent;color:#a7f3c0;border-radius:12px;padding:9px 14px;font-weight:700}
.tab.on{background:#39ff14;color:#031a08;border-color:#39ff14}
.item{background:rgba(0,0,0,.35);border:1px solid rgba(57,255,20,.2);border-radius:14px;padding:12px;margin-bottom:8px}
.item.off{opacity:.45}
.item small{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#6ee7a0}
.item b{display:block;margin:4px 0;color:#fff}
.opts2{font-size:13px;color:rgba(230,255,233,.8);display:flex;flex-wrap:wrap;gap:4px 14px;margin-bottom:8px}
.opts2 .ok{color:#39ff14;font-weight:900}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:100;padding:12px 20px;border-radius:14px;font-weight:800;box-shadow:0 0 24px rgba(0,0,0,.6);animation:pop .35s both;max-width:92vw;text-align:center}
.toast.ok{background:#0a2a12;border:1px solid #39ff14;color:#b8ffc4;box-shadow:0 0 20px rgba(57,255,20,.5)}
.toast.bad{background:#2a0a10;border:1px solid #ff3355;color:#ffc2cc}
.hide{display:none}

@media (max-width:860px){
  .avs{grid-template-columns:repeat(4,1fr)}
  .setup-cols,.cols2,.grid2{grid-template-columns:1fr}
  .stats4{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:520px){
  .big{padding:15px 24px;font-size:16px}
  .bigav{width:160px;height:160px}
  .who b{max-width:90px}
  .opt{font-size:15px;padding:13px}
}
</style>

  var AC = null;
  function tone(f, d, type, w, v) {
    if (S.muted) return;
    try {
      AC = AC || new (window.AudioContext || window.webkitAudioContext)();
      var t = AC.currentTime + (w || 0), o = AC.createOscillator(), g = AC.createGain();
      o.type = type || "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(v || 0.12, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + 0.02);
    } catch (e) {}
  }
  function sfx(n) {
    var m = {
      ok: [[660, .12, "triangle", 0], [880, .15, "triangle", .1], [1320, .25, "triangle", .2]],
      bad: [[220, .25, "sawtooth", 0, .08], [160, .35, "sawtooth", .12, .08]],
      tick: [[1000, .05, "square", 0, .04]],
      start: [[523, .12, "square", 0, .06], [659, .12, "square", .12, .06], [784, .25, "square", .24, .06]],
      win: [523, 659, 784, 1047, 784, 1047].map(function (f, i) { return [f, .2, "triangle", i * .13]; })
    }[n] || [];
    m.forEach(function (a) { tone(a[0], a[1], a[2], a[3], a[4]); });
  }

        '<button class="btn-danger sm" data-act="restore" style="margin-left:auto">↺ Restaurar banco original</button></div><div id="list"></div></div>';
    }
    return header('Panel de Administración <button class="btn-ghost sm" data-act="adminLogout" style="margin-left:8px">🔒 Salir</button>') +
      '<div class="stats4"><div><b>' + bank.length + '</b><small>Total</small></div>' +
      LEVELS.map(function (l) { return '<div><b>' + act.filter(function (q) { return q.difficulty === l.id; }).length + '</b><small>' + l.emoji + ' ' + l.label + '</small></div>'; }).join("") +
      '</div><div class="tabs">' + tabs + '</div>' + body;
  }

  function renderList() {
    var el = $("#list"); if (!el) return;
    var q = S.admin.q.toLowerCase();
    var rows = bank.filter(function (x) {
      return (!S.admin.lvl || x.difficulty === S.admin.lvl) && (!q || (x.text + " " + x.category).toLowerCase().indexOf(q) >= 0);
    }).slice().sort(function (a, b) { return b.id - a.id; });
    var pages = Math.max(1, Math.ceil(rows.length / 25));
    S.admin.page = Math.min(Math.max(1, S.admin.page), pages);
    var slice = rows.slice((S.admin.page - 1) * 25, S.admin.page * 25);
    el.innerHTML = '<p class="muted" style="font-size:13px">' + rows.length + ' resultados</p>' +
      slice.map(function (x) {
        return '<div class="item ' + (x.active ? "" : "off") + '"><small>#' + x.id + ' · ' + (ICON[x.category] || "❓") + ' ' + esc(x.category) + ' · ' + esc(x.difficulty) + '</small><b>' + esc(x.text) + '</b>' +
          '<div class="opts2">' + ["A", "B", "C"].map(function (k) { return '<span class="' + (x.correct === k ? "ok" : "") + '">' + k + ') ' + esc(x["option" + k]) + '</span>'; }).join("") + '</div>' +
          '<div class="row"><button class="btn-ghost sm" data-act="toggle" data-v="' + x.id + '">' + (x.active ? "Desactivar" : "Activar") + '</button>' +
          '<button class="btn-danger sm" data-act="del" data-v="' + x.id + '">Eliminar</button></div></div>';
      }).join("") +
      '<div class="row" style="justify-content:center;margin-top:10px"><button class="btn-ghost sm" data-act="pg" data-v="-1">←</button><span>Página ' + S.admin.page + ' / ' + pages + '</span><button class="btn-ghost sm" data-act="pg" data-v="1">→</button></div>';
  }

  /* ================= Render principal ================= */
  function render() {
    var map = { menu: vMenu, setup: vSetup, intro: vIntro, play: function () { return vPlay(false); }, feedback: function () { return vPlay(true); }, turnEnd: vTurnEnd, final: vFinal, ranking: vRanking, login: vLogin, admin: vAdmin };
    if (S.view === "admin" && !S.adminOk) { S.view = "login"; map.login = vLogin; }
    app.innerHTML = (map[S.view] || vMenu)();
    if (S.view === "admin") renderList();
    if (S.view === "final" && !S.saved) saveGame();
    if (S.prev !== S.view) window.scrollTo(0, 0);
    S.prev = S.view;
  }

  /* ================= Juego ================= */
  function startGame() {
    var ps = S.setup.slice(0, S.np).map(function (p, i) {
      return { name: (p.name || "").trim() || "Jugador " + (i + 1), avatar: p.avatar, score: 0, correct: 0, timeMs: 0, streakMax: 0 };
    });
    var base = bank.filter(function (q) { return q.active && q.difficulty === S.diff; });
    if (!base.length) { toast("No hay preguntas activas en este nivel", false); return; }
    var per = settings.questionsPerTurn, pool = shuffle(base);
    S.decks = ps.map(function () {
      var d = [];
      for (var j = 0; j < per; j++) { if (!pool.length) pool = shuffle(base); d.push(pool.shift()); }
      return d;
    });
    S.players = ps; S.cur = 0; S.saved = false; S.view = "intro";
    sfx("start");
    render();
  }

  function beginTurn() {
    S.qi = 0; S.streak = 0; S.sel = null;
    S.qt = settings.secondsPerQuestion; S.tt = settings.secondsPerPlayer;
    S.turnStart = Date.now();
    S.view = "play";
    render();
    clearInterval(S.iv);
    S.iv = setInterval(tick, 1000);
  }

  function tick() {
    if (S.view !== "play") return;
    S.tt = Math.max(0, S.tt - 1);
    S.qt = Math.max(0, S.qt - 1);
    if (S.qt > 0 && S.qt <= 4) sfx("tick");
    updTimers();
    if (S.qt === 0 || S.tt === 0) answer(null);
  }

  function answer(opt) {
    if (S.view !== "play") return;
    var q = S.decks[S.cur][S.qi], ok = opt === q.correct;
    var pts = ok ? 100 + Math.round(S.qt / settings.secondsPerQuestion * 50) + Math.min(S.streak, 5) * 10 : 0;
    S.streak = ok ? S.streak + 1 : 0;
    S.last = pts; S.sel = opt || "TIMEOUT";
    var p = S.players[S.cur];
    p.score += pts; if (ok) p.correct++;
    p.streakMax = Math.max(p.streakMax, S.streak);
    sfx(ok ? "ok" : "bad");
    S.view = "feedback";
    render();
    clearTimeout(S.fb);
    S.fb = setTimeout(nextQ, 1900);
  }

  function nextQ() {
    if (S.view !== "feedback") return;
    if (S.qi + 1 >= settings.questionsPerTurn || S.tt <= 0) return endTurn();
    S.qi++; S.qt = settings.secondsPerQuestion; S.sel = null; S.view = "play";
    render();
  }

  function endTurn() {
    clearInterval(S.iv);
    S.players[S.cur].timeMs = Date.now() - S.turnStart;
    S.view = "turnEnd";
    render();
  }

  function saveGame() {
    S.saved = true;
    var g = store.get(KEY.games, []);
    g.unshift({ id: Date.now(), date: new Date().toISOString(), difficulty: S.diff, players: S.players, winner: rankOf(S.players)[0].name });
    store.set(KEY.games, g.slice(0, 200));
    sfx("win");
  }

  /* ================= Admin: acciones ================= */
  function parseImport(text) {
    var t = (text || "").trim(), out = [];
    if (!t) return out;
    if (t.charAt(0) === "[") {
      JSON.parse(t).forEach(function (x) { out.push(normalize(x)); });
    } else {
      t.split("\n").map(function (l) { return l.trim(); }).filter(Boolean).forEach(function (l) {
        var f = l.split("|").map(function (s) { return s.trim(); });
        var pos = Math.floor(Math.random() * 3), o = [f[4], f[5]];
        o.splice(pos, 0, f[3]);
        out.push(normalize({ difficulty: f[0], category: f[1], text: f[2], optionA: o[0], optionB: o[1], optionC: o[2], correct: "ABC".charAt(pos), explanation: f[6] }));
      });
    }
    return out.filter(function (x) { return x.text && x.optionA && x.optionB && x.optionC; });
  }
  function normalize(x) {
    return {
      category: String(x.category || "General").trim() || "General",
      difficulty: LEVELS.some(function (l) { return l.id === x.difficulty; }) ? x.difficulty : "principiante",
      text: String(x.text || "").trim(),
      optionA: String(x.optionA || "").trim(), optionB: String(x.optionB || "").trim(), optionC: String(x.optionC || "").trim(),
      correct: ["A", "B", "C"].indexOf(x.correct) >= 0 ? x.correct : "A",
      explanation: String(x.explanation || "").trim() || null
    };
  }
  function addRows(list) {
    var id = nextId();
    list.forEach(function (x) { bank.push(Object.assign({}, x, { id: id++, active: true })); });
    saveBank();
  }

  function saveCfg() {
    settings = {
      defaultDifficulty: $("#c-lvl").value,
      allowDifficultyChoice: $("#c-choose").value === "1",
      secondsPerQuestion: cl($("#c-sq").value, 5, 60, 16),
      secondsPerPlayer: cl($("#c-sp").value, 30, 600, 120),
      questionsPerTurn: cl($("#c-qt").value, 3, 30, 10)
    };
    store.set(KEY.settings, settings);
    S.diff = settings.defaultDifficulty;
    toast("Configuración guardada ✔");
    render();
  }

  function addOne() {
    var x = normalize({ category: $("#n-cat").value, difficulty: $("#n-lvl").value, text: $("#n-text").value, optionA: $("#n-a").value, optionB: $("#n-b").value, optionC: $("#n-c").value, correct: $("#n-ok").value, explanation: $("#n-ex").value });
    if (!x.text || !x.optionA || !x.optionB || !x.optionC) { toast("Completá la pregunta y las 3 opciones", false); return; }
    addRows([x]);
    toast("Pregunta agregada ✔");
    ["#n-text", "#n-a", "#n-b", "#n-c", "#n-ex"].forEach(function (s) { $(s).value = ""; });
  }

  function importNow() {
    var list;
    try { list = parseImport($("#imp").value); } catch (e) { toast("Formato inválido (JSON mal escrito)", false); return; }
    if (!list.length) { toast("No se encontraron preguntas válidas", false); return; }
    addRows(list);
    $("#imp").value = "";
    toast(list.length + " preguntas importadas ✔");
    render();
  }

  function exportBank() {
    var blob = new Blob([JSON.stringify(bank, null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "saludados-banco.json";
    document.body.appendChild(a); a.click(); a.remove();
  }

  /* ================= Eventos ================= */
  document.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest("[data-act]");
    if (!b || b.disabled) return;
    var a = b.getAttribute("data-act"), v = b.getAttribute("data-v");
    switch (a) {
      case "go":
        clearInterval(S.iv); clearTimeout(S.fb);
        S.view = v; render(); break;
      case "mute":
        S.muted = !S.muted; store.set(KEY.muted, S.muted); render(); break;
      case "np": S.np = Number(v); render(); break;
      case "diff": S.diff = v; render(); break;
      case "av": S.setup[Number(b.getAttribute("data-i"))].avatar = v; render(); break;
      case "start": startGame(); break;
      case "begin": beginTurn(); break;
      case "pick": answer(v); break;
      case "nextPlayer":
        if (S.cur + 1 < S.players.length) { S.cur++; S.view = "intro"; } else { S.view = "final"; }
        render(); break;
      case "adminLogin": {
        var f = $("#apw");
        var v2 = f ? f.value : "";
        if (v2 === ADMIN_PASS) {
          S.adminOk = true; store.set(KEY.adminok, true); S.adminPass = "";
          toast("Acceso concedido ✔"); S.view = "admin"; render();
        } else {
          var e = $("#aerr"); if (e) e.classList.remove("hide");
          if (f) { f.value = ""; f.focus(); }
        }
        break;
      }
      case "adminLogout":
        S.adminOk = false; store.set(KEY.adminok, false); S.view = "menu"; render(); break;
      case "tab": S.admin.tab = v; render(); break;
      case "saveCfg": saveCfg(); break;
      case "addQ": addOne(); break;
      case "importNow": importNow(); break;
      case "export": exportBank(); break;
      case "restore":
        if (confirm("¿Restaurar el banco original? Se perderán las preguntas agregadas en este dispositivo.")) {
          bank = seedRows(); saveBank(); toast("Banco original restaurado ✔"); render();
        }
        break;
      case "toggle":
        bank.forEach(function (q) { if (q.id === Number(v)) q.active = !q.active; });
        saveBank(); renderList(); break;
      case "del":
        if (confirm("¿Eliminar esta pregunta?")) { bank = bank.filter(function (q) { return q.id !== Number(v); }); saveBank(); render(); }
        break;
      case "pg": S.admin.page += Number(v); renderList(); break;
    }
  });

  document.addEventListener("input", function (e) {
    var t = e.target;
    if (t.getAttribute && t.getAttribute("data-field") === "name") S.setup[Number(t.getAttribute("data-i"))].name = t.value;
    if (t.id === "bq") { S.admin.q = t.value; S.admin.page = 1; renderList(); }
  });

  document.addEventListener("change", function (e) {
    var t = e.target;
    if (t.id === "bl") { S.admin.lvl = t.value; S.admin.page = 1; renderList(); }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && S.view === "login" && e.target && e.target.id === "apw") {
      var b = document.querySelector('[data-act="adminLogin"]'); if (b) b.click();
    }
    if (t.id === "imf" && t.files && t.files[0]) {
      var r = new FileReader();
      r.onload = function () { $("#imp").value = String(r.result); toast("Archivo cargado. Presioná Importar."); };
      r.readAsText(t.files[0]);
    }
  });

  // Evitar menú contextual en la app (modo escritorio/tablet)
  document.addEventListener("contextmenu", function (e) { if (!/INPUT|TEXTAREA/.test(e.target.tagName)) e.preventDefault(); });

  render();
})();
</script>
</body>
</html>
